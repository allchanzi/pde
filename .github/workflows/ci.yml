name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all -- --check

      - name: Test Rust workspace
        run: cargo test --workspace --locked

      - name: Lint Rust workspace
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Build release without local paths
        shell: bash
        run: |
          source scripts/rust-build-env.sh
          cargo build --workspace --release --locked
          python3 scripts/check_release_privacy.py target/release/pde-tui

      - name: Check shell syntax
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            if head -n 1 "$file" | grep -Eq '^#!.*(bash|/sh)([[:space:]]|$)'; then
              bash -n "$file"
            fi
          done < <(find install.sh bin presets docker/pde -type f | sort)

      - name: Check worktree deletion
        run: python3 scripts/test_projects.py

      - name: Check supervised development workflow
        run: python3 -B scripts/test_workflow.py

      - name: Install Neovim
        run: sudo apt-get update && sudo apt-get install -y neovim

      - name: Check Neovim review comments
        run: nvim --headless -u NONE -l scripts/test_workflow_review.lua

  fresh-linux-install:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build clean Ubuntu install smoke image
        run: docker build -f docker/Dockerfile.install-smoke -t pde-install-smoke .
